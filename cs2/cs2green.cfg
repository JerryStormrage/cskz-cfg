// CS2 KZ Green：原生移动，灵敏度 1.0。
// 切换模式时释放旧动作；迟到的松键事件不再改绑滚轮。
-forward; -back; -left; -right; -jump; -duck; -use; -attack2;
alias "-kz_forward" "-forward";
alias "-kz_jump" "-jump";
alias "-kz_takeoff" "-jump";
alias "-Nleft" "-left";
alias "-Nright" "-right";
alias pcs "";
alias kz_ad_sound_toggle "";
alias kz_autorelease_toggle "";
unbind o;
unbind p;
unbind f5;
unbind f6;
unbind f7;

// 基础设置
sensitivity 1.000000000;                             // 加载此模式时设置的初始灵敏度。
cl_use_opens_buy_menu 0;                               // 关闭使用键打开购买菜单。
bind w +forward;                                       // W：向前移动。
bind a +left;                                          // A：普通左移。
bind s +back;                                          // S：向后移动。
bind d +right;                                         // D：普通右移。
bind space +jump;                                      // 空格：跳跃。
bind ctrl +duck;                                       // Ctrl：按住蹲伏。
bind shift +sprint;                                    // Shift：按住静步。
bind mwheeldown +jump;                                 // 滚轮向下：普通跳跃。
bind e +use;                                           // E：使用或交互。
bind mouse1 +attack;                                   // 鼠标左键：主攻击。
bind mouse2 +attack2;                                  // 鼠标右键：副攻击。
bind mouse3 player_ping;                               // 按下滚轮：玩家标记。
bind l "toggle r_fullscreen_gamma 1.0 1.8 2.2 2.6";    // L：切换亮度 Gamma 1.0 / 1.8 / 2.2 / 2.6。

// KZ 设置
// KZ 功能键：kz_* 和聊天命令依赖服务器插件
bind mwheelup kz_cp;                                       // 滚轮向上：保存 KZ 检查点。
bind 1 kz_cp;                                              // 1：保存当前检查点。
bind 2 kz_tp;                                              // 2：传送到检查点。
bind 3 kz_prevcp;                                          // 3：选择上一个检查点。
bind 4 kz_nextcp;                                          // 4：选择下一个检查点。
bind 5 kz_undo;                                            // 5：执行 KZ 撤销功能，具体撤销范围由服务器插件决定。
bind 6 kz_pause;                                           // 6：暂停或恢复 KZ 计时。
bind 7 kz_restart;                                         // 7：重新开始 KZ 跑图。
bind n kz_noclip;                                          // N：切换 KZ 穿墙功能，是否可用由服务器决定。
bind x kz_paint;                                           // X：使用 KZ 喷涂标记功能。
bind c kz_cleardecals;                                     // C：调用 KZ 清理贴花/标记命令，清理范围由服务器决定。
bind h "toggle cl_draw_only_deathnotices 0 1; kz_hide";    // H：同时切换精简 HUD 和玩家隐藏；两项是独立开关。
bind j "say !jsalways";                                    // J：向聊天发送 !jsalways，调用服务器的持续显示跳跃数据功能。
unbind 8;                                                  // 解除 8 的绑定，清除该键在其他模式中的功能。

// 按住 Z 临时使用无线电，松开恢复检查点功能
alias +kz_radio "bind 1 roger; bind 2 negative; bind 3 cheer; bind 4 holdpos; bind 5 followme; bind 6 thanks; unbind 7";                 // 按住 Z：1–6 临时改为收到、否定、欢呼、守住、跟随、感谢；临时解绑 7。
alias -kz_radio "bind 1 kz_cp; bind 2 kz_tp; bind 3 kz_prevcp; bind 4 kz_nextcp; bind 5 kz_undo; bind 6 kz_pause; bind 7 kz_restart";    // 松开 Z：将 1–7 全部恢复为检查点、传送、撤销、暂停和重开功能。
bind z +kz_radio;                                                                                                                        // 按住 Z 进入临时无线电键位，松开 Z 恢复 KZ 数字键。

// Zerok 偏好：来自 2026-09-08 提供的新版 !o 菜单部分导出
// 导出提示：创意工坊地图会忽略 setinfo；请在主菜单执行后再进入服务器，
// 或自行在 CS2 启动选项加入 -disable_workshop_command_filtering。
// 控制台单次输入上限为 512 字符；可分批粘贴，或通过 CFG 执行（仍受上述过滤限制）。
// setinfo 写入供插件读取的偏好；这里只包含用户导出的项目。
// 更新偏好时用新的 !o 导出替换本段，不自行递增时间戳。
// 若不希望某项跟随你，先移除本文件对应行，再在控制台运行 setinfo kzp_<name> ""。
// 未导出的项目不推测默认值，颜色编码和等级含义以插件为准。
setinfo kzp__stamp 1788847058;    // 导出附带的偏好时间戳，保留原值；插件如何比较新旧以其实现为准。

// 语言、可见性与视野
setinfo kzp_preferredLanguage "chi";    // 插件首选语言：chi（中文）。
setinfo kzp_hideOtherPlayers 0;         // 隐藏其他玩家：0 表示不隐藏。
setinfo kzp_hideLegs 1;                 // 隐藏自己的腿部模型：1 表示开启。
setinfo kzp_fov 100;                    // 插件视野设置：100。
setinfo kzp_mapOverlay 0;               // 地图叠加显示选项：0 表示关闭；具体显示内容由插件定义。

// 计时器显示
setinfo kzp_mhudTimerX -44;                       // 计时器水平位置参数：-44。
setinfo kzp_mhudTimerY 0;                         // 计时器垂直位置参数：0。
setinfo kzp_mhudTimerFont "stratum2-black-tf";    // 计时器字体：stratum2-black-tf。
setinfo kzp_mhudTimerDetailed 0;                  // 计时器详细显示：0 表示关闭。
setinfo kzp_mhudTimerProColor 16771839;           // PRO 计时颜色：保留导出的打包颜色数值 16771839。
setinfo kzp_mhudTimerTpColor 16771839;            // TP 计时颜色：保留导出的打包颜色数值 16771839。

// 速度与起跳速度显示
setinfo kzp_mhudSpeedFont "stratum2-black-tf";      // 当前速度字体：stratum2-black-tf。
setinfo kzp_mhudSpeedOutline 0;                     // 当前速度文字描边：0 表示关闭。
setinfo kzp_mhudSpeedColor 16771839;                // 当前速度颜色：保留导出数值 16771839。
setinfo kzp_mhudPrespeedFont "stratum2-black-tf";   // 起跳速度字体：stratum2-black-tf。
setinfo kzp_mhudPrespeedOutline 0;                  // 起跳速度文字描边：0 表示关闭。
setinfo kzp_mhudPrespeedColor 16771839;             // 起跳速度颜色：保留导出数值 16771839。

// 按键显示
setinfo kzp_mhudKeysFont "stratum2-bold-tf";    // 按键显示字体：stratum2-bold-tf。
setinfo kzp_mhudKeysOutline 1;                 // 按键显示描边：1 表示开启。
setinfo kzp_mhudKeysIdle 1;                    // 按键空闲显示选项：保留新版导出值 1，具体行为由插件定义。
setinfo kzp_mhudKeysLetters 1;                 // 按键字母显示选项：1 表示开启。
setinfo kzp_mhudKeysSquare 1;                  // 按键方形样式选项：1 表示开启。
setinfo kzp_mhudKeysColor 16771839;            // 按键显示颜色：保留导出数值 16771839。

// 检查点显示与菜单字体
setinfo kzp_mhudCheckpointX -44;                       // 检查点信息水平位置参数：-44。
setinfo kzp_mhudCheckpointY 5;                         // 检查点信息垂直位置参数：5。
setinfo kzp_mhudCheckpointFont "stratum2-black-tf";    // 检查点信息字体：stratum2-black-tf。
setinfo kzp_mhudCheckpointColor 16771839;              // 检查点信息颜色：保留导出数值 16771839。
setinfo kzp_menuFont "stratum2-black-tf";              // 插件菜单字体：stratum2-black-tf。

// 喷涂设置
setinfo kzp_paintColor 4278190335;    // 喷涂颜色：保留导出的打包颜色数值 4278190335。
setinfo kzp_paintSize 8;              // 喷涂大小参数：8。
setinfo kzp_showAllPaint 0;           // 显示全部喷涂选项：0 表示关闭，具体可见范围由插件决定。

// 跳跃统计设置
setinfo kzp_jsExtendedChatStats 1;    // 聊天中的扩展跳跃统计：1 表示开启。
setinfo kzp_jsMinTier 1;              // 聊天跳跃统计最低等级阈值：1；等级名称以当前插件为准。
setinfo kzp_jsMinTierConsole 2;       // 控制台跳跃统计最低等级阈值：2。
setinfo kzp_jsSoundMinTier 1;         // 跳跃成绩提示音最低等级阈值：1。

// 模式入口
bind mouse4 "exec cs2green";
bind mouse5 "exec cs2bind";
echo "[CS2KZ] Green | sensitivity 1.0 | Mouse4 Green / Mouse5 Bind";
sensitivity;
