// CS2 KZ Bind：先加载 Green 的通用按键与偏好，再启用可选辅助。
// 每次加载重置 O/P 开关为关闭；无需单独的 cs2-w.cfg。
exec cs2green;
sensitivity 2.7;

// AD 节拍音：默认关闭，A/D 使用同一种短提示音
alias pcs "play \sounds\ui\beep07.vsnd_c";                                                         // 定义短提示音命令，播放游戏资源中的 beep07。
alias +Nleft "+left; pcs";                                                                         // 按下左移别名时：开始向左移动，并播放一次提示音。
alias -Nleft "-left";                                                                              // 松开左移别名时：停止向左移动。
alias +Nright "+right; pcs";                                                                       // 按下右移别名时：开始向右移动，并播放一次提示音。
alias -Nright "-right";                                                                            // 松开右移别名时：停止向右移动。
alias kz_ad_sound_on "bind a +Nleft; bind d +Nright; alias kz_ad_sound_toggle kz_ad_sound_off";    // 开启音效：将 A/D 绑定到带声音的移动别名，并让下次切换执行关闭。
alias kz_ad_sound_off "bind a +left; bind d +right; alias kz_ad_sound_toggle kz_ad_sound_on";      // 关闭音效：恢复 A/D 的原生移动绑定，并让下次切换执行开启。
alias kz_ad_sound_toggle kz_ad_sound_on;                                                           // 初始化音效开关：本次加载后第一次按 O 执行开启。
bind o kz_ad_sound_toggle;                                                                         // 键盘 O：切换 AD 节拍音；与聊天中的 !o 设置菜单命令无关。

// P：自动松 W，保留原 cs2-w.cfg 的起跳机制。
// 关闭时移除松键事件中的改绑操作，避免旧事件恢复辅助。
alias "+kz_jump" "jump 1 0 0";
alias "-kz_jump" "jump -999 0 0";
alias "+kz_takeoff" "jump 1 0 0";
alias "+kz_forward" "+forward;bind mwheeldown +kz_takeoff";
alias "-kz_forward" "-forward";
alias kz_takeoff_arm "alias -kz_takeoff kz_takeoff_release";
alias kz_takeoff_release "-forward;bind mwheeldown +kz_jump";
alias kz_takeoff_disarm "alias -kz_takeoff -jump";
alias kz_autorelease_on "-forward;-jump;kz_takeoff_arm;bind w +kz_forward;bind mwheeldown +kz_jump;alias kz_autorelease_toggle kz_autorelease_off;echo [CS2KZ] Auto W release ON";
alias kz_autorelease_off "-forward;-jump;kz_takeoff_disarm;bind w +forward;bind mwheeldown +jump;alias kz_autorelease_toggle kz_autorelease_on;echo [CS2KZ] Auto W release OFF";
bind p kz_autorelease_toggle;
kz_autorelease_off;

echo "[CS2KZ] Bind | sensitivity 2.7 | O AD sound / P auto W release (default OFF)";
echo "[CS2KZ] Mouse4 Green / Mouse5 Bind";
sensitivity;
