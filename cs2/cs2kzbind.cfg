// cs2kzbind.cfg：仅覆盖自动松 W 相关绑定。
// 首次使用先 exec cs2kzgreen，再按 P 进入 Bind。
// 通用按键、mhud、灵敏度及 O 节拍音状态沿用当前设置。
// 切换前先松开移动、跳跃和蹲伏键。

// 自动松 W 随 Bind 模式开启，Green 会解除相关动作与滚轮改绑。
alias "+kz_jump" "jump 1 0 0";
alias "-kz_jump" "jump -999 0 0";
alias "+kz_takeoff" "jump 1 0 0";
alias "-kz_takeoff" "-forward;bind mwheeldown +kz_jump";
alias "+kz_forward" "+forward;bind mwheeldown +kz_takeoff";
alias "-kz_forward" "-forward";
bind w +kz_forward;
bind mwheeldown +kz_jump;
bind p "exec cs2kzgreen";    // P：回到 Green，关闭自动松 W。

// 控制台确认：只显示最终模式。
echo "============================================================================";
echo "[CS2KZ] Bind | auto W release ON";
echo "[CS2KZ] P: switch to Green | O: AD sound (state preserved)";
echo "[CS2KZ] G: toggle night vision (sw_nv; server plugin required)";
echo "[CS2KZ] Mouse2: duck | J: kz_jsalways";
echo "[CS2KZ] 1/WHEELUP: checkpoint | 2: teleport | 3/4: previous/next CP";
echo "[CS2KZ] 5: undo | 6: pause | 7: restart | N: noclip";
echo "[CS2KZ] X: paint | C: clear decals | H: HUD/hide | Z: hold radio";
echo "[CS2KZ] WHEELDOWN: jump with auto W release";
echo "============================================================================";
sensitivity;
