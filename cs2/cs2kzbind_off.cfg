// 退出 Bind 前先松开移动、跳跃和蹲伏键。
// 旧辅助按键的松开事件只停止动作，不再改绑滚轮。
alias "-kz_forward" "-forward";
alias "-kz_jump" "-jump";
alias "-kz_takeoff" "-jump";
bind w +forward;
bind mwheeldown +jump;
bind p "exec cs2kzbind; play \sounds\cs_cfg\very_simple.vsnd_c";
echo "[CS2KZ] Green | auto W release OFF | P: enter Bind";
