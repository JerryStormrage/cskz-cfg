// cs2kzgreen.cfg：CS2 KZ Green，原生移动，灵敏度 2.70000000。
// 模式切换时的收尾处理（以下内容通常不需要手动修改）：
// 按键按下和松开时可以分别执行不同操作；下面以 - 开头的 alias（别名）定义松开时的操作。
// 如果切回 Green 后才收到旧辅助按键的松开事件，下面让它只停止对应动作。
// 尤其是 -kz_takeoff：Bind 中它会重新绑定滚轮，这里改为停止跳跃，防止滚轮又变回辅助跳跃。
// 这些 alias 只是修改松开时要执行的内容，加载本段不会立即替你松开所有按键。
// 使用方法：先松开移动、跳跃和蹲伏键，再按 P 切换模式。
// 不在 P 上一次执行所有方向的停止命令，是为了避免 CS2 报“back can't follow forward”等输入冲突。
alias "-kz_forward" "-forward";
alias "-kz_jump" "-jump";
alias "-kz_takeoff" "-jump";
alias "-Nleft" "-left";
alias "-Nright" "-right";
// 暂时清空节拍音及其开关；本文件后面的 AD 节拍音部分会重新设置。
alias pcs "";
alias kz_ad_sound_toggle "";

// 基础设置
sensitivity 2.70000000;                             // 加载此模式时设置的初始灵敏度。
cl_use_opens_buy_menu 0;                               // 关闭使用键打开购买菜单。
bind w +forward;                                       // W：向前移动。
bind a +left;                                          // A：普通左移。
bind s +back;                                          // S：向后移动。
bind d +right;                                         // D：普通右移。
bind space +jump;                                      // 空格：跳跃。
bind ctrl +duck;                                       // Ctrl：按住蹲伏。
bind shift +sprint;                                    // Shift：按住静步。
bind mwheeldown +jump;                                 // 滚轮向下：普通跳跃。
bind e +use;                                           // E：使用或交互。
bind mouse1 +attack;                                   // 鼠标左键：主攻击。
bind mouse3 player_ping;                               // 按下滚轮：玩家标记。
bind l "toggle r_fullscreen_gamma 1.0 1.8 2.2 2.6";    // L：切换亮度 Gamma 1.0 / 1.8 / 2.2 / 2.6。

// KZ 设置
bind g sw_nv;    // G：切换服务器 NV 夜视，需服务器安装对应插件。
bind mouse2 +duck;    // Mouse2：按住蹲伏，两种模式一致。
// KZ 功能键：kz_* 和聊天命令依赖服务器插件
bind mwheelup kz_cp;                                       // 滚轮向上：保存 KZ 检查点。
bind 1 kz_cp;                                              // 1：保存当前检查点。
bind 2 kz_tp;                                              // 2：传送到检查点。
bind 3 kz_prevcp;                                          // 3：选择上一个检查点。
bind 4 kz_nextcp;                                          // 4：选择下一个检查点。
bind 5 kz_undo;                                            // 5：执行 KZ 撤销功能，具体撤销范围由服务器插件决定。
bind 6 kz_pause;                                           // 6：暂停或恢复 KZ 计时。
bind 7 kz_restart;                                         // 7：重新开始 KZ 跑图。
bind n kz_noclip;                                          // N：切换 KZ 穿墙功能，是否可用由服务器决定。
bind x kz_paint;                                           // X：使用 KZ 喷涂标记功能。
bind c kz_cleardecals;                                     // C：调用 KZ 清理贴花/标记命令，清理范围由服务器决定。
bind h "toggle cl_draw_only_deathnotices 0 1; kz_hide";    // H：同时切换精简 HUD 和玩家隐藏；两项是独立开关。
bind j kz_jsalways;    // J：直接调用插件控制台命令，不发送公屏聊天。

// Zed 服务器 meme 语音：按住 Z 临时使用无线电命令，松开恢复检查点。
// 其他服务器的语音支持和内容可能不同，保留这套 Zed 键位。
alias +kz_radio "bind 1 roger; bind 2 negative; bind 3 cheer; bind 4 holdpos; bind 5 followme; bind 6 thanks; unbind 7";                 // 按住 Z：1–6 临时改为收到、否定、欢呼、守住、跟随、感谢；临时解绑 7。
alias -kz_radio "bind 1 kz_cp; bind 2 kz_tp; bind 3 kz_prevcp; bind 4 kz_nextcp; bind 5 kz_undo; bind 6 kz_pause; bind 7 kz_restart";    // 松开 Z：将 1–7 全部恢复为检查点、传送、撤销、暂停和重开功能。
bind z +kz_radio;                                                                                                                        // 按住 Z 进入临时无线电键位，松开 Z 恢复 KZ 数字键。

// Zerok 偏好：mhud 采用最新英文客户端导出，时间戳沿用原值。
// 请在主菜单执行后进服；创意工坊内 setinfo 可能被过滤。
// 时间戳沿用导出原值，不自行递增。其他已有个人偏好保留。
// 英文导出中 mhud 字段已完整；其余已有偏好（含中文语言）保持不变。
setinfo kzp__stamp 1789406952;
setinfo kzp_hudLegacyStyle 0;
setinfo kzp_showPanel 1;
setinfo kzp_compactPanel 0;

// HUD 准星
setinfo kzp_mhudCrosshair 0;
setinfo kzp_mhudCrosshairScale 100;

// 观战跟随
setinfo kzp_mhudMimicSpec 0;

// 计时器
setinfo kzp_mhudTimerEnabled 1;
setinfo kzp_mhudTimerX -44;
setinfo kzp_mhudTimerY 0;
setinfo kzp_mhudTimerAlign 1;
setinfo kzp_mhudTimerSize 24;
setinfo kzp_mhudTimerFont "stratum2-black-tf";
setinfo kzp_mhudTimerOutline 1;
setinfo kzp_mhudTimerOpacity 100;
setinfo kzp_mhudTimerDetailed 0;
setinfo kzp_mhudTimerShowState 1;
setinfo kzp_mhudTimerProColor 16771839;
setinfo kzp_mhudTimerTpColor 16771839;
setinfo kzp_mhudTimerPausedColor -65281;
setinfo kzp_mhudTimerStoppedColor -6250241;

// 当前速度
setinfo kzp_mhudSpeedEnabled 1;
setinfo kzp_mhudSpeedX 0;
setinfo kzp_mhudSpeedY 8;
setinfo kzp_mhudSpeedAlign 1;
setinfo kzp_mhudSpeedSize 34;
setinfo kzp_mhudSpeedFont "stratum2-black-tf";
setinfo kzp_mhudSpeedOutline 0;
setinfo kzp_mhudSpeedOpacity 100;
setinfo kzp_mhudSpeedPrecise 0;
setinfo kzp_mhudSpeedBorder 0;
setinfo kzp_mhudSpeedColor 16771839;
setinfo kzp_mhudSpeedCjColor 16771839;
setinfo kzp_mhudSpeedPerfColor 16771839;
setinfo kzp_mhudSpeedCrouchPerfColor 16771839;
setinfo kzp_mhudSpeedJumpbugColor 16771839;

// 起跳速度
setinfo kzp_mhudPrespeedEnabled 1;
setinfo kzp_mhudPrespeedX 0;
setinfo kzp_mhudPrespeedY 12;
setinfo kzp_mhudPrespeedAlign 1;
setinfo kzp_mhudPrespeedSize 22;
setinfo kzp_mhudPrespeedFont "stratum2-black-tf";
setinfo kzp_mhudPrespeedOutline 0;
setinfo kzp_mhudPrespeedOpacity 100;
setinfo kzp_mhudPrespeedPrecise 0;
setinfo kzp_mhudPrespeedBorder 0;
setinfo kzp_mhudPrespeedShow 0;
setinfo kzp_mhudPrespeedColor 16771839;
setinfo kzp_mhudPrespeedCjColor -65281;
setinfo kzp_mhudPrespeedPerfColor 1090470143;
setinfo kzp_mhudPrespeedCrouchPerfColor 16771839;
setinfo kzp_mhudPrespeedJumpbugColor -57089;

// 按键显示
setinfo kzp_mhudKeysEnabled 1;
setinfo kzp_mhudKeysX 0;
setinfo kzp_mhudKeysY 20;
setinfo kzp_mhudKeysSize 20;
setinfo kzp_mhudKeysFont "stratum2-black-tf";
setinfo kzp_mhudKeysOutline 0;
setinfo kzp_mhudKeysOpacity 100;
setinfo kzp_mhudKeysOverlap 1;
setinfo kzp_mhudKeysOverlapAxis 1;
setinfo kzp_mhudKeysIdle 1;
setinfo kzp_mhudKeysLetters 1;
setinfo kzp_mhudKeysSquare 1;
setinfo kzp_mhudKeysBorder 1;
setinfo kzp_mhudKeysGlow 1;
setinfo kzp_mhudKeysFill 1;
setinfo kzp_mhudKeysColor 16771839;
setinfo kzp_mhudKeysOverlapColor -12566273;
setinfo kzp_mhudKeysOverlapGlowColor -12566273;
setinfo kzp_mhudKeysPressedColor 1005428991;

// 检查点
setinfo kzp_mhudCheckpointEnabled 1;
setinfo kzp_mhudCheckpointX -44;
setinfo kzp_mhudCheckpointY 5;
setinfo kzp_mhudCheckpointAlign 1;
setinfo kzp_mhudCheckpointSize 20;
setinfo kzp_mhudCheckpointFont "stratum2-black-tf";
setinfo kzp_mhudCheckpointOutline 1;
setinfo kzp_mhudCheckpointOpacity 100;
setinfo kzp_mhudCheckpointColor 16771839;
setinfo kzp_mhudCheckpointTpColor 16771839;

// Perf 提示
setinfo kzp_mhudPerfEnabled 1;
setinfo kzp_mhudPerfX 12;
setinfo kzp_mhudPerfY 11;
setinfo kzp_mhudPerfAlign 1;
setinfo kzp_mhudPerfSize 18;
setinfo kzp_mhudPerfFont "stratum2-black-tf";
setinfo kzp_mhudPerfOutline 1;
setinfo kzp_mhudPerfOpacity 100;
setinfo kzp_mhudPerfColor 1090470143;
setinfo kzp_mhudPerfAcronym 0;

// CJ 提示
setinfo kzp_mhudCjEnabled 1;
setinfo kzp_mhudCjX 12;
setinfo kzp_mhudCjY 8;
setinfo kzp_mhudCjAlign 1;
setinfo kzp_mhudCjSize 18;
setinfo kzp_mhudCjFont "stratum2-black-tf";
setinfo kzp_mhudCjOutline 1;
setinfo kzp_mhudCjOpacity 100;
setinfo kzp_mhudCjColor 1911470335;
setinfo kzp_mhudCjAcronym 0;

// Jumpbug 提示
setinfo kzp_mhudJumpbugEnabled 1;
setinfo kzp_mhudJumpbugX 12;
setinfo kzp_mhudJumpbugY 5;
setinfo kzp_mhudJumpbugAlign 1;
setinfo kzp_mhudJumpbugSize 18;
setinfo kzp_mhudJumpbugFont "stratum2-bold-monodigit";
setinfo kzp_mhudJumpbugOutline 1;
setinfo kzp_mhudJumpbugOpacity 100;
setinfo kzp_mhudJumpbugColor -57089;
setinfo kzp_mhudJumpbugAcronym 0;

// 其余已有个人偏好
setinfo kzp_preferredLanguage "chi";    // 插件首选语言：chi（中文）。
setinfo kzp_hideOtherPlayers 0;         // 隐藏其他玩家：0 表示不隐藏。
setinfo kzp_hideLegs 1;                 // 隐藏自己的腿部模型：1 表示开启。
setinfo kzp_fov 100;                    // 插件视野设置：100。
setinfo kzp_mapOverlay 0;               // 地图叠加显示选项：0 表示关闭；具体显示内容由插件定义。
setinfo kzp_menuFont "stratum2-black-tf";              // 插件菜单字体：stratum2-black-tf。
setinfo kzp_paintColor 4278190335;    // 喷涂颜色：保留导出的打包颜色数值 4278190335。
setinfo kzp_paintSize 8;              // 喷涂大小参数：8。
setinfo kzp_showAllPaint 0;           // 显示全部喷涂选项：0 表示关闭，具体可见范围由插件决定。
setinfo kzp_jsExtendedChatStats 1;    // 聊天中的扩展跳跃统计：1 表示开启。
setinfo kzp_jsMinTier 1;              // 聊天跳跃统计最低等级阈值：1；等级名称以当前插件为准。
setinfo kzp_jsMinTierConsole 2;       // 控制台跳跃统计最低等级阈值：2。
setinfo kzp_jsSoundMinTier 1;         // 跳跃成绩提示音最低等级阈值：1。

// AD 节拍音：默认关闭，A/D 使用同一种短提示音
alias pcs "play \sounds\ui\beep07.vsnd_c";                                                         // 定义短提示音命令，播放游戏资源中的 beep07。
alias +Nleft "+left; pcs";                                                                         // 按下左移别名时：开始向左移动，并播放一次提示音。
alias -Nleft "-left";                                                                              // 松开左移别名时：停止向左移动。
alias +Nright "+right; pcs";                                                                       // 按下右移别名时：开始向右移动，并播放一次提示音。
alias -Nright "-right";                                                                            // 松开右移别名时：停止向右移动。
alias kz_ad_sound_on "bind a +Nleft; bind d +Nright; alias kz_ad_sound_toggle kz_ad_sound_off";    // 开启音效：将 A/D 绑定到带声音的移动别名，并让下次切换执行关闭。
alias kz_ad_sound_off "bind a +left; bind d +right; alias kz_ad_sound_toggle kz_ad_sound_on";      // 关闭音效：恢复 A/D 的原生移动绑定，并让下次切换执行开启。
alias kz_ad_sound_toggle kz_ad_sound_on;                                                           // 初始化音效开关：本次加载后第一次按 O 执行开启。
bind o kz_ad_sound_toggle;                                                                         // 键盘 O：切换 AD 节拍音；与聊天中的 !o 设置菜单命令无关。


bind p "exec cs2kzbind";    // P：进入 Bind，自动启用自动松 W。

// 控制台确认：只显示最终模式。
echo "============================================================================";
echo "[CS2KZ] Green | sensitivity 2.70000000";
echo "[CS2KZ] P: switch to Bind | O: AD sound (default OFF)";
echo "[CS2KZ] G: toggle night vision (sw_nv; server plugin required)";
echo "[CS2KZ] Mouse2: duck | J: kz_jsalways";
echo "[CS2KZ] 1/WHEELUP: checkpoint | 2: teleport | 3/4: previous/next CP";
echo "[CS2KZ] 5: undo | 6: pause | 7: restart | N: noclip";
echo "[CS2KZ] X: paint | C: clear decals | H: HUD/hide | Z: hold radio";
echo "[CS2KZ] WHEELDOWN: normal jump";
echo "============================================================================";
sensitivity;
