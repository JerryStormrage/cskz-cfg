// CS2 MG/竞技共用配置，保留原有 ZE 购买快捷键。
// 主键盘 0：返回 KZ Green；P 也可返回 Green。
// 切换前请松开移动、跳跃、蹲伏和 Z 键；切换不会自动释放所有动作。

// 旧辅助的松键事件只停止对应动作，不得重新绑定滚轮或数字键。
alias "-kz_forward" "-forward";
alias "-kz_jump" "-jump";
alias "-kz_takeoff" "-jump";
alias "-Nleft" "-left";
alias "-Nright" "-right";
alias "-kz_radio" "";
alias pcs "";
alias kz_ad_sound_toggle "";

// 基础设置
sensitivity 1.000000000;
cl_use_opens_buy_menu 0;
bind w +forward;
bind a +left;
bind s +back;
bind d +right;
bind space +jump;
bind ctrl +duck;
bind shift +sprint;
bind mwheeldown +jump;
bind mwheelup +jump;    // 不再使用 KZ 滚轮存点。
bind e +use;
bind mouse1 +attack;
bind mouse2 +attack2;
bind mouse3 player_ping;
bind l "toggle r_fullscreen_gamma 1.0 1.8 2.2 2.6";

// MG/竞技：恢复武器数字键及无线电入口，解除 KZ 专用功能键。
bind 1 slot1;
bind 2 slot2;
bind 3 slot3;
bind 4 slot4;
bind 5 slot5;
bind 6 slot6;
bind 7 slot7;
bind z radio;
bind x slot12;
bind c radio2;
bind g drop;
unbind n;
unbind i;    // MG：解除 KZ 自由观察快捷键。
bind h kz_hide;    // H：只切换玩家隐藏；需要服务器支持，不调整 HUD 元素。
unbind j;
unbind o;
cl_draw_only_deathnotices 0;    // 恢复完整游戏 HUD。
// 移除旧 MG 文件使用的侧键模式入口。
unbind mouse4;
unbind f8;    // MG：解除 KZ 鼠标切换快捷键。
unbind mouse5;

// ZE 快捷购买：仅在支持这些聊天命令的服务器有效。
bind f5 "say !negev";
bind f6 "say !xz";
bind f7 "say !he";
bind 8 "toggle sensitivity 1.000000000 0.450000000000";

// 返回 KZ 时重新加载完整 Green 配置，恢复灵敏度 2.7、HUD 配置及 KZ 按键。
bind 0 "exec cs2kzgreen";
bind p "exec cs2kzgreen";
echo "============================================================================";
echo "[CS2CFG] MG mode | sensitivity 1.0 | Mouse2: secondary attack";
echo "[CS2CFG] 0 or P: return to KZ Green | 8: sensitivity 1.0 / 0.45";
echo "[CS2CFG] F5/F6/F7: ZE purchases | G: drop | Z/C: radio | X: healthshot";
echo "[CS2CFG] H: hide players (server plugin required)";
echo "============================================================================";
sensitivity;
r_fullscreen_gamma;
