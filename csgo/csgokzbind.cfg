// csgokzbind.cfg：独立加载通用设置与 Bind 辅助，不执行 Green 文件。
// P 切换回 Green；O 节拍音、K 2tick 每次加载默认关闭。
sensitivity 2.7000000000000;

// 通用设置与 Green 保持一致，然后由下方 Bind 设置覆盖移动绑定。
// 功能 1：切换前释放旧模式可能遗留的持续动作

-forward;    // 停止可能由旧 Null 或自动松 W 功能留下的向前移动。
-back;    // 停止可能由旧模式留下的向后移动。
-moveleft;    // 停止可能由旧 Null 留下的向左移动。
-moveright;    // 停止可能由旧 Null 留下的向右移动。
-jump;    // 停止可能由 2 tick 或 Mouse2 蹲跳留下的跳跃状态。
-duck;    // 停止可能由 2 tick 或 Mouse2 蹲跳留下的蹲伏状态。
-use;    // 停止切换模式时可能仍处于按下状态的使用动作。
-attack2;    // 停止切换模式时可能仍处于按下状态的武器右键动作。
-klook;    // 停止旧 Mouse2 自动松 W 功能使用的键盘视角控制状态。

// 功能 2：拦截 bind 模式切换后迟到的松键事件

alias "-reset1" "-forward";    // 若 W 在 bind 模式中按下、切换到 green 后才松开，只停止前进，不再重新启用 Null。
alias "-reset2" "-back";    // 若 S 在 bind 模式中按下、切换到 green 后才松开，只停止后退，不再重新启用 Null。
alias "-mleft" "-moveleft";    // 若 A 在 Null 状态按下、切换到 green 后才松开，只停止左移。
alias "-mright" "-moveright";    // 若 D 在 Null 状态按下、切换到 green 后才松开，只停止右移。
alias "-reset" "-use;-duck;-jump";    // 若 E 在 2 tick 模式中按下、切换到 green 后才松开，安全释放使用、蹲伏和跳跃。
alias "-cjump" "-duck;-jump;-klook";    // 若 Mouse2 在自动松 W 模式中按下、切换到 green 后才松开，安全释放相关状态。
alias "checkleft" "";    // 清空 Null 对 A 按下状态的内部记忆。
alias "checkright" "";    // 清空 Null 对 D 按下状态的内部记忆。
alias "-dbj1" "";    // 取消迟到的 2 tick 第 1 步滚轮松开事件，防止它再次改绑 mwheelup。
alias "-dbj2" "";    // 取消迟到的 2 tick 第 2 步滚轮松开事件，防止它再次改绑 mwheelup。
alias "-dbj3" "";    // 取消迟到的 2 tick 第 3 步滚轮松开事件，防止它再次改绑 mwheelup。
alias "-dbj4" "";    // 取消迟到的 2 tick 第 4 步滚轮松开事件，防止它再次改绑 mwheelup。

// 关闭 Bind 开关及声音钩子。
alias csgokz_ad_tick "";
alias csgokz_ad_sound_toggle "";
alias csgokz_autorelease_toggle "";
alias csgokz_autorelease_on "";
alias csgokz_autorelease_off "";
alias csgokz_2tick_toggle "";
unbind o;
unbind p;

// 功能 3：通用的普通移动

bind "w" "+forward";    // W 使用 CS:GO 默认前进方式。
bind "a" "+moveleft";    // A 使用 CS:GO 默认左移方式，不启用 Null。
bind "s" "+back";    // S 使用 CS:GO 默认后退方式。
bind "d" "+moveright";    // D 使用 CS:GO 默认右移方式，不启用 Null。
bind "space" "+jump";    // Space 使用普通跳跃。
bind "ctrl" "+duck";    // Ctrl 使用普通蹲伏。
bind "mouse2" "+duck";    // Mouse2：按住普通蹲伏。
bind "shift" "+speed";    // Shift 使用 CS:GO 默认静步命令。
bind "mwheeldown" "+jump";    // 滚轮向下使用普通跳跃。
bind "mwheelup" "sm_checkpoint";    // 滚轮向上：保存 GOKZ 检查点。

// 功能 4：通用的通用按键

bind "e" "+use";    // E 恢复为普通使用键。
bind "n" "sm_nc";    // N 执行 KZ 服务器的 noclip 命令。
bind "c" "r_cleardecals";    // C 清除血迹、弹痕和贴花。
bind "x" "+paint";    // X 按住时执行 KZ 喷涂标记。
bind "g" "sm_nv";    // G 执行 KZ 服务器的夜视命令。
bind "h" "toggle cl_draw_only_deathnotices 0 1";    // H 在完整 HUD 与仅保留准星/击杀信息之间切换；直接绑定，不依赖自定义 alias。
developer 0;    // 通用关闭 2 tick 配置使用的 developer 屏幕输出级别。
unbind k;    // 通用解除 K 的绑定，退出 2tick 开关后不分配其他功能。


// O：AD 按键提示音，每次按下 A/D 播放一次，不是固定 BPM 循环。
// 声音钩子不改写 A/D 绑定，不影响现有 Null 动态切换。
alias csgokz_ad_sound "play buttons/blip1.wav";
alias csgokz_ad_sound_on "alias csgokz_ad_tick csgokz_ad_sound;alias csgokz_ad_sound_toggle csgokz_ad_sound_off;echo [CSGOKZ] AD sound ON";
alias csgokz_ad_sound_off "alias csgokz_ad_tick none;alias csgokz_ad_sound_toggle csgokz_ad_sound_on;echo [CSGOKZ] AD sound OFF";
bind o csgokz_ad_sound_toggle;

// 功能 2：兼容 WAD/SAD 走地速的 A/D Null

alias "+a" "+moveleft;csgokz_ad_tick";    // 定义临时关闭 Null 时的普通 A 按下动作。
alias "-a" "-moveleft";    // 定义临时关闭 Null 时的普通 A 松开动作。
alias "+d" "+moveright;csgokz_ad_tick";    // 定义临时关闭 Null 时的普通 D 按下动作。
alias "-d" "-moveright";    // 定义临时关闭 Null 时的普通 D 松开动作。
alias "none" "";    // 定义空操作，供 Null 的方向记忆在空状态下调用。
alias "checkleft" "none";    // 初始化 A 的 Null 按键记忆为空。
alias "checkright" "none";    // 初始化 D 的 Null 按键记忆为空。
alias "+mleft" "-moveright;+moveleft;alias checkleft +moveleft;csgokz_ad_tick";    // 按下 Null A 时先取消右移，再开始左移，并记录 A 仍按住。
alias "+mright" "-moveleft;+moveright;alias checkright +moveright;csgokz_ad_tick";    // 按下 Null D 时先取消左移，再开始右移，并记录 D 仍按住。
alias "-mleft" "-moveleft;checkright;alias checkleft none";    // 松开 Null A 时停止左移、恢复仍按住的 D，并清除 A 记忆。
alias "-mright" "-moveright;checkleft;alias checkright none";    // 松开 Null D 时停止右移、恢复仍按住的 A，并清除 D 记忆。
alias "csgokz_clear_checkleft" "alias checkleft none";    // 独立清除 A 的 Null 按键记忆。
alias "csgokz_clear_checkright" "alias checkright none";    // 独立清除 D 的 Null 按键记忆。
alias "csgokz_clear_null_memory" "csgokz_clear_checkleft;csgokz_clear_checkright";    // 同时清除两侧 Null 记忆，保留此前修复过的防卡键逻辑。
alias "csgokz_unnull_bind_a" "bind a +a";    // 将 A 绑定为临时关闭 Null 时的普通左移。
alias "csgokz_unnull_bind_d" "bind d +d";    // 将 D 绑定为临时关闭 Null 时的普通右移。
alias "csgokz_set_unnull" "csgokz_clear_null_memory;csgokz_unnull_bind_a;csgokz_unnull_bind_d";    // 清除旧记忆，并把 A/D 切换为允许 WAD/SAD 的普通移动。
alias "csgokz_null_bind_a" "bind a +mleft";    // 将 A 绑定为 Null 左移。
alias "csgokz_null_bind_d" "bind d +mright";    // 将 D 绑定为 Null 右移。
alias "csgokz_set_null" "csgokz_clear_null_memory;csgokz_null_bind_a;csgokz_null_bind_d";    // 清除旧记忆，并把 A/D 切换为 Null 移动。
alias "+reset1" "csgokz_set_unnull;+forward";    // 按下 W 时临时关闭 A/D Null，并开始向前移动。
alias "-reset1" "csgokz_set_null;-forward";    // 松开 W 时重新启用 A/D Null，并停止向前移动。
alias "+reset2" "csgokz_set_unnull;+back";    // 按下 S 时临时关闭 A/D Null，并开始向后移动。
alias "-reset2" "csgokz_set_null;-back";    // 松开 S 时重新启用 A/D Null，并停止向后移动。

// 功能 3：mwheelup 四步 2 tick 蹲跳

alias "change_mwhup" "bind mwheelup +dbj1";    // 将 mwheelup 重置为四步动作的第 1 步。
alias "+dbj1" "+duck;echo [CSGOKZ] mwheelup step 1: +duck";    // 第 1 步按下蹲伏并输出状态。
alias "csgokz_dbj_next1" "bind mwheelup +dbj2";    // 第 1 步结束后把 mwheelup 切换到第 2 步。
alias "+dbj2" "+jump;echo [CSGOKZ] mwheelup step 2: +jump";    // 第 2 步按下跳跃并输出状态。
alias "csgokz_dbj_next2" "bind mwheelup +dbj3";    // 第 2 步结束后把 mwheelup 切换到第 3 步。
alias "+dbj3" "-jump;echo [CSGOKZ] mwheelup step 3: -jump";    // 第 3 步松开跳跃，以降低动作变成 low jump 的概率。
alias "csgokz_dbj_next3" "bind mwheelup +dbj4";    // 第 3 步结束后把 mwheelup 切换到第 4 步。
alias "+dbj4" "-duck;echo [CSGOKZ] mwheelup step 4: -duck";    // 第 4 步松开蹲伏并输出动作完成状态。
alias "csgokz_dbj_next4" "bind mwheelup +jump";    // 第 4 步结束后把 mwheelup 恢复为普通跳跃。
alias "+reset" "+use;-duck;-jump;change_mwhup;echo [CSGOKZ] 2tick sequence reset";    // 按下 E 时保留 +use，同时释放旧蹲跳状态并把 mwheelup 重置到第 1 步。
alias "-reset" "-use";    // 松开 E 时释放普通使用动作。

// 功能 4：Mouse2 蹲跳并自动松开 W

alias "+cjump" "+duck;+jump;-forward;+klook";    // 按下 Mouse2 时蹲跳、执行 -forward，并开启原配置使用的 klook 状态。
alias "-cjump" "-duck;-jump;-klook";    // 松开 Mouse2 时释放蹲伏、跳跃和 klook 状态。

// 功能 5：启用 Bind 模式与 P 切换入口

developer -1;    // 启用原 2 tick 配置使用的 developer 屏幕输出级别。
csgokz_clear_null_memory;    // 初始化时清除 Null 记忆。
csgokz_set_unnull;    // 加载 bind 模式时先让 A/D 保持普通移动；第一次松开 W 或 S 后再启用 Null，保持原有手感。
bind "w" "+reset1";    // W 改用兼容 WAD 的动态 Null 前进逻辑。
bind "s" "+reset2";    // S 改用兼容 SAD 的动态 Null 后退逻辑。

// E 的绑定由下方 K 键开关管理。

// 自动松 W 蹲跳随 Bind 模式启用，不再单独由 P 开关。
bind mouse2 "+cjump";
alias csgokz_ad_tick none;    // 静默初始化节拍音为关闭。
alias csgokz_ad_sound_toggle csgokz_ad_sound_on;

// 开关同时管理滚轮松键事件，关闭后不会被迟到事件重新改绑。
alias csgokz_2tick_arm "alias -dbj1 csgokz_dbj_next1;alias -dbj2 csgokz_dbj_next2;alias -dbj3 csgokz_dbj_next3;alias -dbj4 csgokz_dbj_next4";
alias csgokz_2tick_disarm "alias -dbj1 none;alias -dbj2 none;alias -dbj3 none;alias -dbj4 none";

// K 键 2tick 开关：只切换入口，保留上方四步动作和 E 重置命令原文。
alias csgokz_2tick_on "-duck;-jump;csgokz_2tick_arm;bind e +reset;alias csgokz_2tick_toggle csgokz_2tick_off;echo [CSGOKZ] 2tick ON - press E to reset";    // 开启后由 E 按原逻辑初始化滚轮；本命令不代替 E 执行重置。
alias csgokz_2tick_off "-duck;-jump;-use;csgokz_2tick_disarm;bind e +use;bind mwheelup sm_checkpoint;alias csgokz_2tick_toggle csgokz_2tick_on;echo [CSGOKZ] 2tick OFF - MWHEELUP checkpoint";    // 关闭时释放蹲跳，恢复普通 E 和滚轮存点，下次 K 开启。
bind k csgokz_2tick_toggle;    // K：交替开启与关闭 2tick。
csgokz_2tick_off;    // 每次加载 bind 模式默认关闭 2tick。
bind p "exec csgokzgreen";    // P：切换回 Green。
unbind mouse4;
unbind mouse5;

// Bind 模式控制台确认：只报告最终模式。
echo "============================================================================";
echo "[CSGOKZ] Bind mode enabled";
echo "[CSGOKZ] P: switch to Green | O: toggle AD sound (default OFF)";
echo "[CSGOKZ] K: toggle 2tick (default OFF)";
echo "[CSGOKZ] Mouse2: crouch-jump and auto release W";
echo "[CSGOKZ] W/S: dynamic WAD/SAD-compatible A/D Null";
echo "[CSGOKZ] A/D Null starts after the first W or S release";
echo "[CSGOKZ] E: use; also reset sequence when 2tick is ON";
echo "[CSGOKZ] MWHEELUP: checkpoint when 2tick OFF";
echo "[CSGOKZ] 2tick ON + E: wheel steps +duck, +jump, -jump, -duck";
echo "[CSGOKZ] G: night vision (sm_nv) | N: noclip (sm_nc)";
echo "[CSGOKZ] C: clear decals | X: hold to paint";
echo "[CSGOKZ] H: toggle death-notices-only HUD";
echo "[CSGOKZ] SPACE: jump | CTRL: duck | SHIFT: walk";
echo "[CSGOKZ] MWHEELDOWN: normal jump | Mouse4/Mouse5: unbound";
echo "============================================================================";
sensitivity;
